    ## Artikel 2 – Toepasselijkheid
    Deze voorwaarden gelden voor alle aanbiedingen, bestellingen en overeenkomsten via de webshop van Raw Atelier.

    ## Artikel 3 – Aanbiedingen
    Alle producten en prijzen zijn onder voorbehoud van typefouten. Digitale producten worden geleverd zoals beschreven.

    ## Artikel 4 – Betaling
    Betalen kan via Stripe Checkout (iDEAL of kaart). Bestellingen worden verwerkt nadat de betaling is ontvangen. Raw Atelier slaat zelf geen kaartgegevens op.

    ## Artikel 5 – Levering
    Fysieke producten: levertijd ongeveer 2 tot 3 weken, afhankelijk van personalisatie.
    Verzending van fysieke producten alleen binnen Nederland. Verzendkosten zie je bij het afrekenen (€ 6,95, tenzij anders vermeld).
    Digitale naaitpatronen hebben geen verzending. Iedereen mag die kopen, waar ter wereld. Na betaling stuur ik de PDF naar het e-mailadres van de bestelling.

    ## Artikel 6 – Digitale producten
    Digitale producten (zoals naaitpatronen) worden na betaling per e-mail geleverd.
    Door de aankoop af te ronden ga je uitdrukkelijk akkoord met directe levering en zie je af van het herroepingsrecht voor dat digitale product.

    ## Artikel 7 – Herroepingsrecht en retour
    Digitale producten: geen herroepingsrecht na levering.
    Gepersonaliseerde of op bestelling gemaakte stukken: niet retourneerbaar.
    Overige fysieke producten zonder personalisatie: binnen 14 dagen, ongebruikt en in originele staat. Retourkosten zijn voor rekening van de klant.

    ## Artikel 8 – Garantie
    Fysieke producten hebben 3 maanden garantie op productiefouten.

    ## Artikel 9 – Aansprakelijkheid
    Raw Luxury is niet aansprakelijk voor indirecte schade of oneigenlijk gebruik van producten.

    ## Artikel 10 – Klachten
    Klachten kun je sturen naar info@rawluxury.nl of via het contactformulier. Ik reageer in de regel binnen 2 werkdagen.

    ## Artikel 11 – Toepasselijk recht
    Op alle overeenkomsten is Nederlands recht van toepassing.

  shippingTitle: Verzending en retour
  shipping: |-
    ## Levering
    Fysieke producten verstuur ik alleen binnen Nederland. De verzendkosten zie je bij het afrekenen in Stripe.
    Digitale naaitpatronen hebben geen verzending. Na betaling stuur ik de PDF naar het e-mailadres van de bestelling, wereldwijd.
    Levertijd voor fysieke, gepersonaliseerde stukken is meestal 2 tot 3 weken. Ik geef je na de bestelling een realistische planning.

    ## Herroepingsrecht
    Je mag je bestelling binnen 14 dagen herroepen, behalve waar de wet een uitzondering toestaat.

    ## Uitzonderingen
    Het herroepingsrecht geldt niet voor:
    - digitale producten na levering
    - gepersonaliseerde of op bestelling gemaakte stukken

    ## Retourvoorwaarden
    Retour is mogelijk voor niet-gepersonaliseerde fysieke producten, binnen 14 dagen, ongebruikt en in originele staat. Retourkosten zijn voor jouw rekening.

    ## Hoe retourneren
    Stuur een e-mail naar info@rawluxury.nl met je bestelgegevens.

    ## Terugbetaling
    Terugbetaling gebeurt binnen 14 dagen na ontvangst van de retourzending.
    Beschadigd of verkeerd geleverd? Mail me, dan zoeken we een oplossing.

  privacyTitle: Privacyverklaring
  privacy: |-
    Raw Atelier / Raw Luxury respecteert je privacy.

    ## Welke gegevens
    - naam en adresgegevens (bij verzending)
    - e-mailadres
    - betaalgegevens (via Stripe, niet op onze server)
    - bericht via het contactformulier (Netlify Forms)
    - technische gegevens die nodig zijn om de site en winkelwagen te laten werken

    ## Waarom
    - bestellingen verwerken en verzenden
    - klantenservice
    - de website laten werken (winkelwagen, taal, cookievoorkeur)

    ## Bewaartermijn
    Niet langer dan nodig voor het doel waarvoor de gegevens zijn verzameld.

    ## Delen
    Alleen met partijen die nodig zijn voor de bestelling, zoals Stripe (betaling) en de vervoerder. Geen verkoop van gegevens.

    ## Jouw rechten
    Je mag je gegevens inzien, laten corrigeren, laten verwijderen of bezwaar maken. Stuur een verzoek naar info@rawluxury.nl.

    ## Beveiliging
    Ik neem passende maatregelen om je gegevens te beschermen.

    ## Cookies
    Zie de cookieverklaring voor meer informatie. Google Analytics gebruiken we alleen als je daar via de cookiebanner toestemming voor geeft.

  disclaimerTitle: Disclaimer
  disclaimer: |-
    De inhoud van deze website is met zorg samengesteld.

    ## Aansprakelijkheid
    Raw Luxury is niet aansprakelijk voor:
