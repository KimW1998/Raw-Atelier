metadata:
  home:
    title: Raw Atelier
    description: >-
      Creative embroidery studio in the Netherlands. Custom embroidery, live events, corporate apparel, personalised
      gifts and embroidery digitizing. Made with care in the Netherlands.
  about:
    title: About
    description: >-
      Meet Kim and Raw Atelier: a creative embroidery studio in the Netherlands, specialising in custom work,
      creativity and personal collaboration.
  services:
    title: Services
    description: >-
      Explore Raw Atelier's embroidery services: live events, corporate apparel, personalised gifts, embroidery
      digitizing, sewing projects and creative collaborations in the Netherlands.
  portfolio:
    title: Portfolio
    description: >-
      Browse Raw Atelier's embroidery portfolio: live events, corporate apparel, personalised baby gifts, keychains,
      jewellery, sewing work and embroidery digitizing in the Netherlands.
  shop:
    title: Shop
    description: >-
      Discover machine-embroidered products from Raw Atelier. Personalised gifts, accessories and digital embroidery
      and sewing patterns.
      Physical orders ship within the Netherlands. Digital patterns are available worldwide.
  contact:
    title: Contact
    description: >-
      Get in touch with Raw Atelier for custom embroidery, live events, corporate orders, embroidery digitizing and
      personalised gifts. Based in the Netherlands.
  faq:
    title: FAQ
    description: >-
      Frequently asked questions about ordering, shipping, sewing patterns, returns and custom work at Raw Atelier.
  keywords: >-
    custom embroidery Netherlands, live embroidery events, embroidery digitizing, logo digitizing, personalized
    embroidery, corporate embroidery, name keychain, fabric name banner, Raw Atelier
