legal:
  termsTitle: Terms and conditions
  terms: |-
    ## Article 1 – Business details
    Raw Atelier is the creative embroidery studio of Raw Luxury.

    Raw Luxury
    Fuutstraat 4, 2421 XS Nieuwkoop, The Netherlands
    Email: info@rawluxury.nl
    Chamber of Commerce: 83007849
    VAT: NL003761795B22
    Website: www.rawatelier.nl

    ## Article 2 – Applicability
    These terms apply to all offers, orders and agreements made through the Raw Atelier webshop.

    ## Article 3 – Offers
    All products and prices are subject to errors. Digital products are delivered as described.

    ## Article 4 – Payment
    Payment is made via Stripe Checkout (iDEAL or card). Orders are processed after payment has been received. Raw Atelier does not store card details.

    ## Article 5 – Delivery
    Physical products: lead time about 2 to 3 weeks, depending on personalisation.
    Physical products ship within the Netherlands only. Shipping costs appear at checkout (€ 6.95 unless stated otherwise).
    Digital sewing patterns have no shipping. Anyone can buy them, anywhere in the world. After payment I email the PDF to the address used at checkout.

    ## Article 6 – Digital products
    Digital products (such as sewing patterns) are emailed after payment.
    By completing the purchase you agree to immediate delivery and waive the right of withdrawal for that digital product.

    ## Article 7 – Withdrawal and returns
    Digital products: no right of withdrawal after delivery.
    Personalised or made-to-order pieces cannot be returned.
    Other unused physical products without personalisation: within 14 days, unused and in original condition. Return shipping is at the customer’s expense.

    ## Article 8 – Warranty
    Physical products have a 3-month warranty on manufacturing defects.

    ## Article 9 – Liability
    Raw Luxury is not liable for indirect damage or improper use of products.

    ## Article 10 – Complaints
    Send complaints to info@rawluxury.nl or through the contact form. I aim to reply within 2 working days.

    ## Article 11 – Applicable law
    All agreements are governed by Dutch law.

  shippingTitle: Shipping and returns
  shipping: |-
    ## Delivery
    Physical products ship within the Netherlands only. Shipping costs appear at Stripe Checkout.
    Digital sewing patterns have no shipping. After payment I email the PDF worldwide to the checkout address.
    Lead time for personalised physical pieces is usually 2 to 3 weeks. I share a realistic timeline after your order.

    ## Right of withdrawal
    You may cancel your order within 14 days, except where the law allows an exception.

    ## Exceptions
    The right of withdrawal does not apply to:
    - digital products after delivery
    - personalised or made-to-order pieces

    ## Return conditions
    Returns are accepted for non-personalised physical products, within 14 days, unused and in original condition. Return shipping is at your expense.

    ## How to return
    Email info@rawluxury.nl with your order details.

    ## Refunds
    Refunds are issued within 14 days after receiving the returned items.
    Damaged or incorrect delivery? Email me and we will find a solution.

  privacyTitle: Privacy policy
  privacy: |-
    Raw Atelier / Raw Luxury respects your privacy.

    ## What we collect
    - name and address details (for shipping)
    - email address
    - payment details (through Stripe, not stored on our server)
    - messages via the contact form (Netlify Forms)
    - technical data needed for the site and cart to work

    ## Why
    - processing and shipping orders
    - customer service
    - running the website (cart, language, cookie preference)

    ## Retention
    No longer than needed for the purpose for which the data was collected.

    ## Sharing
    Only with parties needed for the order, such as Stripe (payments) and the carrier. We do not sell your data.

    ## Your rights
    You may access, correct, delete or object to processing. Send a request to info@rawluxury.nl.

    ## Security
    We take appropriate measures to protect your data.

    ## Cookies
    See the cookie policy for more information. We only use Google Analytics if you allow it in the cookie banner.

