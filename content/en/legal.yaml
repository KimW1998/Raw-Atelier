  cookiesTitle: Cookie policy (EU)
  cookies: |-
    This Cookie Policy was last updated on 30 August 2026 and applies to visitors in the European Economic Area, the United Kingdom and Switzerland.

    ## 1. Introduction
    This website, https://www.rawatelier.nl (hereinafter: “the website”), uses cookies and similar technologies such as scripts and local storage in your browser (for convenience all of these are called “cookies”). Cookies may also be placed by third parties we use, for example when you pay or when fonts are loaded. Below we explain which cookies we use, why, and how you can change your choice.

    Raw Atelier is the public name of Raw Luxury.

    ## 2. What are cookies?
    A cookie is a small file that is sent with pages of this website and stored by your browser on your computer or another device. The information stored there may be sent back to our servers or to third-party servers on a later visit.

    We also use local storage. That works in a similar way: data stays in your browser until you delete it or until it expires.

    ## 3. What are scripts?
    A script is a piece of program code used to make the website work and stay interactive. This code runs on our server or on your device.

    ## 4. What is a web beacon?
    A web beacon (or pixel tag) is a small, often invisible piece of text or image used to measure traffic on a website. Various data about you may be stored that way. We do not place tracking pixels without your consent. With consent, Google Analytics may use this kind of technology. Stripe may use its own technologies at checkout.

    ## 5. Types of cookies

    ### 5.1 Technical or functional cookies
    Some cookies make sure parts of the website work and that your preferences are remembered. Functional cookies mean you do not have to enter the same information again, and items can stay in your shopping cart until you pay. We may place these cookies without your consent, because the shop would not work properly without them.

    ### 5.2 Statistics (optional)
    Statistics cookies help us see how the website is used, for example which pages are viewed. These are off by default. We only place them if you choose this in the cookie banner or via Cookie settings at the bottom of the site. With consent we use Google Analytics 4. Google advertising cookies stay off.

    ## 6. Cookies placed

    ### Raw Atelier (this website)
    Functional. This data stays on your device and is not shared with third parties.

    - raw-atelier-cookie-consent — stores your cookie choice (necessary and, if you allow it, analytics). Retention: until you clear it in your browser.
    - raw-atelier-cart-v2 — stores your shopping cart. Retention: until you empty the cart or clear the data in your browser.

    Your language preference (Dutch or English) is in the web address, not in a separate cookie.

    ### Google Fonts
    Functional. We load the Inter and Playfair Display fonts through Google Fonts so the site looks consistent. Your browser then connects to Google servers (fonts.googleapis.com and fonts.gstatic.com).

    Sharing data: Google may receive your IP address and technical browser data. See Google’s privacy policy.

    ### Google Analytics
    Statistics (optional). Only if you allow analytics. We then measure anonymised or pseudonymised visit data, such as pages, country/language and device type. Google’s script loads only after your consent. Ads and ad personalisation stay off.

    Sharing data: Google Ireland Limited / Google LLC. See https://policies.google.com/privacy and https://business.safety.google/privacy/

    - _ga — up to 2 years — distinguish visitors
    - _ga_* — up to 2 years — keep the Google Analytics 4 session

    ### Stripe
    Functional. We use Stripe for payments (iDEAL and card). At checkout you go to Stripe’s secure pages. Raw Atelier does not store card details.

    Sharing data: Stripe may place cookies for payment and fraud prevention. See Stripe’s privacy policy: https://stripe.com/privacy

    Typical Stripe functions include fraud prevention (up to 1 year) and a session during checkout.

    ### Netlify
    Functional. The website is hosted by Netlify. Contact forms go through Netlify Forms. Netlify may use technical cookies or logs for security, hosting and form handling.

    Sharing data: see Netlify’s privacy policy.

    ### Instagram feed (optional)
    If the homepage shows an Instagram overview, posts are loaded via Behold. Your browser then connects to feeds.behold.so. That only happens if that feed is set up.

    ## 7. Consent
    When you first visit, we show a banner about cookies. Necessary cookies are always on. If you click “Allow all”, you also consent to optional analytics. If you click “Necessary only”, statistics stay off. Under Settings you can choose per category.

    You can disable cookies in your browser, but the shop may then stop working properly (for example the cart).

    ### 7.1 Manage your consent
    Cookie settings at the bottom of every page opens the banner again so you can change your preference. You can also delete cookies in your browser; on a later visit we will ask again if the previous storage is gone.

    ## 8. Enabling, disabling and deleting cookies
    You can use your browser to delete cookies automatically or by hand, or to block certain cookies. You can also ask your browser to notify you each time a cookie is placed. See the help section of your browser.

    Please note that the website may not work properly if all cookies are disabled. If you delete cookies, necessary cookies will be placed again after your next visit.

    ## 9. Your rights with respect to personal data
    For personal data processed through cookies or similar technologies, you have among others these rights:

    - the right to know why your data is needed, what happens to it, and how long it is kept
    - right of access: you may ask what personal data we hold
    - right to rectification: you may have data completed, corrected, deleted or blocked
    - if processing is based on consent, you may withdraw that consent and ask for deletion
    - right to data portability: you may request your data and transfer it to another controller
    - right to object: you may object to processing, unless there are legitimate grounds to continue

    To exercise these rights, use the contact details below. If you have a complaint about how we handle your data, we would like to hear from you. You also have the right to lodge a complaint with the Dutch Data Protection Authority (Autoriteit Persoonsgegevens).

    More on privacy is in the privacy policy on this website.

