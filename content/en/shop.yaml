      eyebrow: Pouches & bags
      title: Drawstring bags & pouches
      description: Soft personalised pouches for gifts, baby items and everyday storage.
    patterns:
      eyebrow: Sewing patterns
      title: Digital sewing patterns
      description: PDF patterns for anyone, worldwide. After payment I email the file to you.
  digitalPatterns:
    eyebrow: Digital patterns
    title: Digital PDF patterns
    description: >-
      Embroidery and sewing patterns as PDFs. No shipping: after payment I email the file, worldwide.
    intro: >-
      These are digital files, not physical products. You sew or embroider them yourself. After payment through Stripe
      I email the PDF to the checkout address.
    pointEmail: Emailed after payment
    pointWorldwide: Worldwide
    pointNoShipping: No shipping
    embroideryTitle: Embroidery patterns
    embroideryDescription: Machine embroidery files and patterns to stitch yourself, delivered as a PDF.
    embroideryEmpty: >-
      The first embroidery patterns will appear here. Add them in the studio, or send a message if you already have
      something in mind.
    sewingTitle: Sewing patterns
    sewingDescription: PDF sewing patterns with step-by-step instructions, for beginners and experienced sewists.
    sewingEmpty: No sewing patterns in this category yet.
    emptyNote: No digital patterns in the shop yet.
  madeToOrder:
    eyebrow: Made to order
    title: Sewn on request
    description: >-
      These pieces are not listed as ready-made products yet. Send your ideas and measurements through the contact form.
    cta: Request a custom order
    items:
      ereaderCases:
        name: Quilted e-reader & tablet cases
        description: Soft protective cases sewn to order for your device, fabric and embroidery preferences.
      customPouches:
        name: Custom pouches & accessories
        description: Custom pouches, cases and embroidered accessories tailored to your size and style.
