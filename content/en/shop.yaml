shopPage:
  hero:
    eyebrow: Shop
    title: Embroidered products and digital patterns
    description: >-
      Personalised machine embroidery, baby gifts, keychains, pouches and digital embroidery and sewing patterns. You
      pay through Stripe, on their secure checkout page.
  shippingNote: >-
    Digital patterns (PDF): available to everyone, worldwide, emailed after payment. Other products: shipping within the
    Netherlands only.
  trust:
    description: >-
      For personalised pieces, I contact you after your order to confirm names, fabrics, colours and details.
