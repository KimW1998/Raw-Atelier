# Auto-generated — run: node scripts/generate-cms-config.mjs
backend:
  name: git-gateway
  branch: main
locale: nl
site_url: https://www.rawatelier.nl
display_url: https://www.rawatelier.nl
logo:
  src: /images/brand/raw-atelier-logo.png
  show_in_header: true
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: portfolio-items
    label: Portfolio
    label_singular: Portfolio-item
    description: Foto's en titels voor de portfolio-pagina en de homepage.
    files:
      - label: Alle items
        name: portfolio-items
        file: content/portfolio-items.yaml
        fields:
          - label: Items
            name: items
            widget: list
            label_singular: item
            summary: '{{fields.title.nl}}'
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            fields:
              - label: Foto
                name: image
                widget: image
              - label: Titel
                name: title
                widget: object
                fields:
                  - label: Nederlands
                    name: nl
                    widget: string
                  - label: English
                    name: en
                    widget: string
              - label: Categorie
                name: category
                widget: select
                options:
                  - label: Events
                    value: events
                  - label: Zakelijk
                    value: corporate
                  - label: Cadeaus
                    value: gifts
                  - label: Mode
                    value: fashion
                  - label: Digitizen
                    value: digitizing
              - label: Vorm van de foto
                name: aspect
                widget: select
                options:
                  - label: Liggend
                    value: wide
                  - label: Staand
                    value: tall
                  - label: Vierkant
                    value: square
              - label: Ook op de homepage
                name: featured
                widget: boolean
                default: false
              - label: ID
                name: id
                widget: string
                hint: Korte slug, bijv. balloon-gift
  - name: shop-catalog
    label: Shop
    description: 'Producten in de webshop: foto, prijs, NL/EN teksten.'
    files:
      - label: Alle producten
        name: shop-catalog
        file: src/data/shop-catalog.json
        format: json
        fields:
          - label: Producten
            name: products
            widget: list
            label_singular: product
            summary: '{{fields.name.nl}}'
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            fields:
              - label: Hoofdfoto
                name: image
                widget: image
              - label: Extra foto's
                name: images
                widget: list
                required: false
                field:
                  label: Foto
                  widget: image
                hint: Extra productfoto's. De hoofdfoto staat hierboven.
              - label: Naam
                name: name
                widget: object
                fields:
                  - label: Nederlands
                    name: nl
                    widget: string
                  - label: English
                    name: en
                    widget: string
              - label: Beschrijving
                name: description
                widget: object
                fields:
                  - label: Nederlands
                    name: nl
                    widget: text
                  - label: English
                    name: en
                    widget: text
              - label: Prijs op de site
                name: priceLabel
                widget: string
                hint: Bijv. € 35,00
              - label: Prijs in centen
                name: priceCents
                widget: number
                value_type: int
                hint: 3500 = € 35,00
              - label: Type
                name: type
                widget: select
                options:
                  - label: Fysiek (verzending NL)
                    value: physical
                  - label: Digitaal (PDF)
                    value: digital
              - label: Tab in de shop
                name: section
                widget: select
                options:
                  - label: Baby cadeaus
                    value: babyGifts
                  - label: Keychains
                    value: keychains
                  - label: Patches
                    value: patches
                  - label: Tassen
                    value: pouches
                  - label: Borduurpatronen (PDF)
                    value: embroideryPatterns
                  - label: Naaitpatronen (PDF)
                    value: sewingPatterns
              - label: Voorraad
                name: stock
                widget: number
                value_type: int
                required: false
                hint: Leeg = onbeperkt. 0 = uitverkocht.
              - label: Personalisatie nodig
                name: personalization
                widget: boolean
                default: false
              - label: Shop-opties
                name: options
                widget: list
                required: false
                collapsed: true
                label_singular: optie
                hint: Stof (fotovakjes), hardware (kleuren), naam, notitie of prijs per letter.
                fields:
                  - label: ID
                    name: id
                    widget: string
                  - label: Type
                    name: type
                    widget: select
                    options:
                      - label: Stof (fotovakjes)
                        value: fabric
                      - label: Hardware (kleurvakjes)
                        value: hardware
                      - label: Naamveld
                        value: name
                      - label: Extra notitie
                        value: note
                      - label: Prijs per letter
                        value: letters
                  - label: Verplicht
                    name: required
                    widget: boolean
                    default: true
                  - label: Label
                    name: label
                    widget: object
                    fields:
                      - label: Nederlands
                        name: nl
                        widget: string
                      - label: English
                        name: en
                        widget: string
                  - label: Prijs per letter in centen
                    name: pricePerLetterCents
                    widget: number
                    value_type: int
                    required: false
                  - label: Vanaf aantal letters
                    name: minLetters
                    widget: number
                    value_type: int
                    required: false
                  - label: Max aantal letters
                    name: maxLetters
                    widget: number
                    value_type: int
                    required: false
                  - label: Keuzes (stof of hardware)
                    name: choices
                    widget: list
                    required: false
                    collapsed: true
                    fields:
                      - label: ID
                        name: id
                        widget: string
                      - label: Naam
                        name: label
                        widget: object
                        fields:
                          - label: Nederlands
                            name: nl
                            widget: string
                          - label: English
                            name: en
                            widget: string
                      - label: Foto
                        name: image
                        widget: image
                        required: false
                      - label: Kleur (hex)
                        name: color
                        widget: string
                        required: false
                        hint: 'Bijv. #C5A572'
              - label: Link naar PDF (optioneel)
                name: digitalFile
                widget: string
                required: false
              - label: ID
                name: id
                widget: string
